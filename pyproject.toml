[project]
name = "ai-context-hub"
version = "0.2.0"
description = "On-demand Git-backed project context, task packets and UAT feedback across AI tools"
requires-python = ">=3.10"

[project.scripts]
ach = "ach:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ach"]
package-dir = {"" = "src"}
